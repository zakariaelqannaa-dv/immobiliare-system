[alembic]
script_location = alembic
# Overridden by env.py from IMMOBILIARE_DB_URL when set; kept as local default.
sqlalchemy.url = sqlite:///data/immobiliare.db
file_template = %%(rev)s_%%(slug)s
version_locations = alembic/versions
prepend_sys_path = .

[post_write_hooks]
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic
