[project]
name = "immobiliare-system"
version = "1.0.0"
description = "Immobiliare System - professional desktop real-estate management (PySide6)"
readme = "README.md"
authors = [{ name = "zakariaelqannaa-dv" }]
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.7.0",
  "SQLAlchemy==2.0.44",
  "alembic>=1.13.0",
  "pydantic>=2.7.0",
  "argon2-cffi>=23.1.0",
  "cryptography>=42.0.0",
  "keyring>=25.0.0",
  "reportlab>=4.1.0",
  "Pillow>=10.3.0",
  "openpyxl>=3.1.2",
  "python-dotenv>=1.0.1"
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "PyInstaller>=6.5.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
