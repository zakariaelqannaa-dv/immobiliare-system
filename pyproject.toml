[project]
name = "immobiliare-system"
version = "1.1.0"
description = "Immobiliare System - professional desktop real-estate management (PySide6)"
readme = "README.md"
authors = [{ name = "zakariaelqannaa-dv" }]
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.9.0,<7",
  "SQLAlchemy>=2.0.54,<2.1",
  "alembic>=1.19,<2",
  "pydantic>=2.11",
  "argon2-cffi>=25.1.0",
  "cryptography>=50.0.1",
  "keyring>=25.7.0",
  "reportlab>=4.4.2",
  "Pillow>=12.3.0",
  "openpyxl>=3.1.5",
  "python-dotenv>=1.2.3"
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "PyInstaller>=6.22.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
